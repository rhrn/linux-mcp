name: ci
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans

  release-build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release --target ${{ matrix.target }}
      - run: tar -czf linux-mcp-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release linux-mcp
      - uses: actions/upload-artifact@v7
        with:
          name: linux-mcp-${{ matrix.target }}
          path: linux-mcp-${{ matrix.target }}.tar.gz

  release:
    needs: release-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
